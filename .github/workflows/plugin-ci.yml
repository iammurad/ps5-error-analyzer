name: Plugin CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - automatic-collector
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    name: build-plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out analyzer
        uses: actions/checkout@v4

      - name: Set up Python for etaHEN packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build unzip curl

      - name: Find the latest PS5 payload SDK release
        id: sdk
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: "ps5-payload-dev",
              repo: "sdk",
            });
            const asset = release.data.assets.find((item) =>
              item.name.toLowerCase().includes("sdk") && item.name.endsWith(".zip")
            );
            if (!asset) throw new Error("Latest PS5 payload SDK release has no SDK ZIP asset");
            core.setOutput("url", asset.browser_download_url);

      - name: Install the PS5 payload SDK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ps5-sdk"
          curl --fail --location "${{ steps.sdk.outputs.url }}" --output "$RUNNER_TEMP/ps5-sdk.zip"
          unzip -q "$RUNNER_TEMP/ps5-sdk.zip" -d "$RUNNER_TEMP/ps5-sdk"
          chmod -R 0777 "$RUNNER_TEMP/ps5-sdk/ps5-payload-sdk"
          test -x "$RUNNER_TEMP/ps5-sdk/ps5-payload-sdk/bin/prospero-clang"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-sdk/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Check out etaHEN Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: etaHEN/etaHEN-Plugins
          ref: 6339554e4e3c92c0a655a37194c1152d6b82ad88
          path: deps/etaHEN-Plugins

      - name: Configure and build the plugin
        shell: bash
        run: |
          cmake -S ps5 -B build-plugin -G Ninja \
            -D "CMAKE_TOOLCHAIN_FILE=$PS5_PAYLOAD_SDK/toolchain/prospero.cmake" \
            -D "PS5_PAYLOAD_SDK=$PS5_PAYLOAD_SDK" \
            -D "ETAHEN_PLUGINS=$GITHUB_WORKSPACE/deps/etaHEN-Plugins"
          cmake --build build-plugin --parallel 2

      - name: Verify and checksum plugin
        shell: bash
        run: |
          test -s ps5/bin/ps5_error_analyzer.plugin
          sha256sum ps5/bin/ps5_error_analyzer.plugin > ps5/bin/ps5_error_analyzer.plugin.sha256

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-error-analyzer-plugin-${{ github.sha }}
          path: |
            ps5/bin/ps5_error_analyzer.plugin
            ps5/bin/ps5_error_analyzer.plugin.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^([0-9])\.([0-9])\.([0-9])$ ]]; then
            echo "VERSION must use the three-part format 0.2.0 (single-digit fields required by the etaHEN plugin format)" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          expected_plugin_version="${major}.${minor}${patch}"
          actual_plugin_version="$(sed -n 's/^[[:space:]]*set(PLUGIN_VERSION "\([0-9]\.[0-9][0-9]\)")$/\1/p' ps5/CMakeLists.txt)"
          if [[ "$actual_plugin_version" != "$expected_plugin_version" ]]; then
            echo "VERSION $version does not match etaHEN PLUGIN_VERSION $actual_plugin_version (expected $expected_plugin_version)" >&2
            exit 1
          fi
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
            echo "Release $tag already exists; skipping duplicate release."
          else
            exists=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Download plugin artifact
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: ps5-error-analyzer-plugin-${{ github.sha }}
          path: release-files

      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release-files/ps5_error_analyzer.plugin \
            release-files/ps5_error_analyzer.plugin.sha256 \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "$GITHUB_SHA"
          gh release view "${{ steps.version.outputs.tag }}" --json body --jq .body > CHANGELOG.md
          gh release upload "${{ steps.version.outputs.tag }}" CHANGELOG.md --clobber
